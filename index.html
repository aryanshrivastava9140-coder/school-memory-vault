<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our School Memories</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            color: #bbb;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .upload-btn {
            background: #111;
            color: white;
        }

        .folder-btn {
            background: white;
            border: 1px solid #ddd;
        }

        h2 {
            margin-bottom: 20px;
        }

        .folders {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .folder {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e5e5e5;
            cursor: pointer;
            transition: 0.2s;
        }

        .folder:hover {
            transform: translateY(-3px);
        }

        .folder-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .folder-name {
            font-weight: bold;
        }

        .folder-count {
            color: #888;
            margin-top: 5px;
            font-size: 14px;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #888;
        }
    </style>
</head>

<body>

<header>
    <h1>Our School Memories</h1>
    <p>2025 — 2026</p>
</header>

<div class="container">

    <div class="actions">
        <button class="upload-btn" onclick="uploadMemory()">
            📤 Upload Memory
        </button>

        <button class="folder-btn" onclick="createFolder()">
            + Create Folder
        </button>
    </div>

    <h2>Memory Folders</h2>

    <div class="folders">

        <div class="folder">
            <div class="folder-icon">📸</div>
            <div class="folder-name">Farewell</div>
            <div class="folder-count">0 memories</div>
        </div>

        <div class="folder">
            <div class="folder-icon">🏀</div>
            <div class="folder-name">Sports</div>
            <div class="folder-count">0 memories</div>
        </div>

        <div class="folder">
            <div class="folder-icon">🚌</div>
            <div class="folder-name">School Trips</div>
            <div class="folder-count">0 memories</div>
        </div>

        <div class="folder">
            <div class="folder-icon">🎤</div>
            <div class="folder-name">Annual Function</div>
            <div class="folder-count">0 memories</div>
        </div>

        <div class="folder">
            <div class="folder-icon">🎓</div>
            <div class="folder-name">Class 12</div>
            <div class="folder-count">0 memories</div>
        </div>

        <div class="folder">
            <div class="folder-icon">😂</div>
            <div class="folder-name">Random Memories</div>
            <div class="folder-count">0 memories</div>
        </div>

    </div>

    <div class="empty">
        <p>Your memories will appear here.</p>
    </div>

</div>

<script>

function uploadMemory() {
    alert("Upload system coming next!");
}

function createFolder() {
    alert("Folder creation system coming next!");
}

</script>

</body>
</html>
