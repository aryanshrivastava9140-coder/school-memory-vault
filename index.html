<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our School Memories</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: #f5f5f5;
    color: #222;
}

/* HEADER */

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 25px 15px;
}

header h1 {
    margin: 0;
    font-size: 24px;
}

header p {
    margin: 7px 0 0;
    color: #aaa;
    font-size: 14px;
}

/* CONTAINER */

.container {
    max-width: 1100px;
    margin: auto;
    padding: 20px;
}

/* BUTTONS */

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 25px;
}

button {
    border: none;
    border-radius: 7px;
    padding: 11px 17px;
    cursor: pointer;
    font-size: 14px;
}

.back-btn {
    background: #111;
    color: white;
}

.create-btn {
    background: white;
    border: 1px solid #ddd;
}

.upload-btn {
    background: #111;
    color: white;
}

/* FOLDERS */

h2 {
    font-size: 20px;
    margin-bottom: 15px;
}

.folders {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 15px;
}

.folder {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 20px;
    cursor: pointer;
    transition: 0.2s;
}

.folder:hover {
    transform: translateY(-2px);
    box-shadow: 0 5px 15px rgba(0,0,0,0.08);
}

.folder-icon {
    font-size: 32px;
    margin-bottom: 12px;
}

.folder-name {
    font-weight: bold;
    font-size: 16px;
}

.folder-count {
    margin-top: 6px;
    color: #888;
    font-size: 13px;
}

/* UPLOAD BOX */

.upload-box {
    background: white;
    border: 1px solid #ddd;
    border-radius: 12px;
    padding: 18px;
    margin-bottom: 25px;
}

.upload-box h3 {
    margin-top: 0;
}

input[type="file"] {
    width: 100%;
    margin: 12px 0;
}

/* GALLERY */

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(180px, 1fr));
    gap: 15px;
}

.memory {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #ddd;
    cursor: pointer;
    aspect-ratio: 1 / 1;
}

.memory img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    display: block;
    transition: 0.2s;
}

.memory:hover img {
    transform: scale(1.03);
}

.empty {
    text-align: center;
    color: #888;
    padding: 50px 20px;
}

/* FULLSCREEN IMAGE */

.viewer {
    display: none;
    position: fixed;
    z-index: 9999;
    inset: 0;
    background: rgba(0,0,0,0.94);
    align-items: center;
    justify-content: center;
    padding: 20px;
}

.viewer img {
    max-width: 95%;
    max-height: 90%;
    object-fit: contain;
    border-radius: 8px;
}

.close-viewer {
    position: absolute;
    top: 20px;
    right: 25px;
    color: white;
    font-size: 35px;
    cursor: pointer;
}

/* STATUS */

#status {
    margin-top: 10px;
    font-size: 14px;
}

/* MOBILE */

@media (max-width: 600px) {

    header {
        padding: 20px 10px;
    }

    header h1 {
        font-size: 21px;
    }

    .container {
        padding: 14px;
    }

    .folders {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .folder {
        padding: 15px;
    }

    .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
    }

    .memory {
        border-radius: 8px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Our School Memories</h1>
    <p>2025 – 2026</p>
</header>

<div class="container">

    <!-- FOLDER PAGE -->

    <section id="folderPage">

        <div class="actions">

            <button class="create-btn" onclick="createFolder()">
                ➕ Create Folder
            </button>

        </div>

        <h2>Memory Folders</h2>

        <div id="folders" class="folders">
            <div class="empty">Loading folders...</div>
        </div>

    </section>


    <!-- MEMORY PAGE -->

    <section id="memoryPage" style="display:none;">

        <div class="actions">

            <button class="back-btn" onclick="showFolders()">
                ← Back to Folders
            </button>

        </div>

        <h2 id="currentFolderName"></h2>

        <div class="upload-box">

            <h3>📸 Upload a Memory</h3>

            <input
                type="file"
                id="photoInput"
                accept="image/*"
                multiple
            >

            <button
                class="upload-btn"
                onclick="uploadPhotos()">
                ⬆️ Upload Photos
            </button>

            <div id="status"></div>

        </div>

        <div id="gallery" class="gallery">
            <div class="empty">Loading memories...</div>
        </div>

    </section>

</div>


<!-- IMAGE VIEWER -->

<div
    id="viewer"
    class="viewer"
    onclick="closeViewer()">

    <span class="close-viewer">×</span>

    <img
        id="viewerImage"
        src=""
        alt="Memory"
        onclick="event.stopPropagation()"
    >

</div>


<script>

/* =====================================================
   SUPABASE CONNECTION
===================================================== */

const SUPABASE_URL =
"https://swqfgyeqltyzeudeaepn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_IFCmPqb8d-CFUVZ8KMr4Iw_eV1QbvsD";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =====================================================
   GLOBAL VARIABLES
===================================================== */

let currentFolder = null;


/* =====================================================
   LOAD FOLDERS
===================================================== */

async function loadFolders() {

    const foldersContainer =
        document.getElementById("folders");

    foldersContainer.innerHTML =
        '<div class="empty">Loading folders...</div>';

    const { data, error } =
        await supabaseClient
        .from("folders")
        .select("*")
        .order("created_at", {
            ascending: true
        });

    if (error) {

        console.error(error);

        foldersContainer.innerHTML =
            '<div class="empty">Unable to load folders.</div>';

        return;
    }

    if (!data || data.length === 0) {

        foldersContainer.innerHTML =
            '<div class="empty">No folders yet.</div>';

        return;
    }

    foldersContainer.innerHTML = "";

    for (const folder of data) {

        /* Get memory count */

        const { count } =
            await supabaseClient
            .from("memories")
            .select("*", {
                count: "exact",
                head: true
            })
            .eq("folder_id", folder.id);

        const folderElement =
            document.createElement("div");

        folderElement.className = "folder";

        folderElement.onclick = () =>
            openFolder(folder);

        folderElement.innerHTML = `

            <div class="folder-icon">
                ${folder.icon || "📁"}
            </div>

            <div class="folder-name">
                ${escapeHTML(folder.name)}
            </div>

            <div class="folder-count">
                ${count || 0} ${count === 1 ? "memory" : "memories"}
            </div>

        `;

        foldersContainer.appendChild(folderElement);
    }
}


/* =====================================================
   CREATE FOLDER
===================================================== */

async function createFolder() {

    const name =
        prompt("Enter the folder name:");

    if (!name || !name.trim()) {
        return;
    }

    const { error } =
        await supabaseClient
        .from("folders")
        .insert({
            name: name.trim(),
            icon: "📁"
        });

    if (error) {

        console.error(error);

        alert(
            "Could not create folder.\n\n" +
            error.message
        );

        return;
    }

    alert("Folder created successfully!");

    loadFolders();
}


/* =====================================================
   OPEN FOLDER
===================================================== */

async function openFolder(folder) {

    currentFolder = folder;

    document.getElementById("folderPage")
        .style.display = "none";

    document.getElementById("memoryPage")
        .style.display = "block";

    document.getElementById("currentFolderName")
        .textContent =
        `${folder.icon || "📁"} ${folder.name}`;

    loadMemories();
}


/* =====================================================
   SHOW FOLDERS
===================================================== */

function showFolders() {

    currentFolder = null;

    document.getElementById("memoryPage")
        .style.display = "none";

    document.getElementById("folderPage")
        .style.display = "block";

    loadFolders();
}


/* =====================================================
   LOAD MEMORIES
===================================================== */

async function loadMemories() {

    const gallery =
        document.getElementById("gallery");

    gallery.innerHTML =
        '<div class="empty">Loading memories...</div>';

    if (!currentFolder) {
        return;
    }

    const { data, error } =
        await supabaseClient
        .from("memories")
        .select("*")
        .eq("folder_id", currentFolder.id)
        .order("created_at", {
            ascending: false
        });

    if (error) {

        console.error(error);

        gallery.innerHTML =
            '<div class="empty">Unable to load memories.</div>';

        return;
    }

    if (!data || data.length === 0) {

        gallery.innerHTML =
            '<div class="empty">📸 No memories yet.</div>';

        return;
    }

    gallery.innerHTML = "";

    data.forEach(memory => {

        const memoryElement =
            document.createElement("div");

        memoryElement.className = "memory";

        memoryElement.innerHTML = `

            <img
                src="${memory.file_url}"
                alt="School memory"
                loading="lazy"
            >

        `;

        memoryElement.onclick = () =>
            openViewer(memory.file_url);

        gallery.appendChild(memoryElement);
    });
}


/* =====================================================
   UPLOAD PHOTOS
===================================================== */

async function uploadPhotos() {

    if (!currentFolder) {

        alert("Please open a folder first.");

        return;
    }

    const input =
        document.getElementById("photoInput");

    const files =
        Array.from(input.files);

    const status =
        document.getElementById("status");

    if (files.length === 0) {

        alert("Please select at least one photo.");

        return;
    }

    status.innerHTML =
        "⏳ Uploading photos...";

    let uploaded = 0;

    for (const file of files) {

        try {

            const safeName =
                file.name
                .replace(/[^a-zA-Z0-9.-]/g, "_");

            const fileName =
                `${currentFolder.id}/${Date.now()}-${Math.random().toString(36).substring(2)}-${safeName}`;


            /* Upload to Storage */

            const { error: uploadError } =
                await supabaseClient
                .storage
                .from("memories")
                .upload(
                    fileName,
                    file,
                    {
                        cacheControl: "3600",
                        upsert: false
                    }
                );

            if (uploadError) {
                throw uploadError;
            }


            /* Get public URL */

            const { data: publicData } =
                supabaseClient
                .storage
                .from("memories")
                .getPublicUrl(fileName);

            const publicURL =
                publicData.publicUrl;


            /* Save information in database */

            const { error: dbError } =
                await supabaseClient
                .from("memories")
                .insert({

                    folder_id:
                        currentFolder.id,

                    file_url:
                        publicURL
                });

            if (dbError) {
                throw dbError;
            }

            uploaded++;

            status.innerHTML =
                `⏳ Uploaded ${uploaded}/${files.length}...`;

        }

        catch (error) {

            console.error(error);

            status.innerHTML =
                "❌ Upload error: " +
                error.message;

            return;
        }
    }

    status.innerHTML =
        `✅ ${uploaded} photo${uploaded === 1 ? "" : "s"} uploaded successfully!`;

    input.value = "";

    await loadMemories();
}


/* =====================================================
   FULLSCREEN VIEWER
===================================================== */

function openViewer(url) {

    const viewer =
        document.getElementById("viewer");

    const image =
        document.getElementById("viewerImage");

    image.src = url;

    viewer.style.display = "flex";
}


function closeViewer() {

    document.getElementById("viewer")
        .style.display = "none";
}


/* =====================================================
   BASIC HTML ESCAPE
===================================================== */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent = text;

    return div.innerHTML;
}


/* =====================================================
   START APP
===================================================== */

loadFolders();

</script>

</body>
</html>
