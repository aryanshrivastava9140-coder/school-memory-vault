<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our School Memories</title>

    <!-- Supabase -->
    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 40px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 32px;
            margin-bottom: 10px;
        }

        header p {
            color: #bbb;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 30px 20px;
        }

        .actions {
            display: flex;
            gap: 12px;
            margin-bottom: 30px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 12px 20px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .upload-btn {
            background: #111;
            color: white;
        }

        .folder-btn {
            background: white;
            border: 1px solid #ddd;
        }

        h2 {
            margin-bottom: 20px;
        }

        .folders {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .folder {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e5e5e5;
            cursor: pointer;
            transition: 0.2s;
        }

        .folder:hover {
            transform: translateY(-3px);
        }

        .folder-icon {
            font-size: 35px;
            margin-bottom: 10px;
        }

        .folder-name {
            font-weight: bold;
        }

        .folder-count {
            color: #888;
            margin-top: 5px;
            font-size: 14px;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #888;
        }

        #status {
            margin-top: 20px;
            text-align: center;
            font-size: 14px;
        }
    </style>
</head>

<body>

<header>
    <h1>Our School Memories</h1>
    <p>2025 — 2026</p>
</header>

<div class="container">

    <div class="actions">

        <button class="upload-btn" onclick="uploadMemory()">
            📤 Upload Memory
        </button>

        <button class="folder-btn" onclick="createFolder()">
            + Create Folder
        </button>

    </div>

    <h2>Memory Folders</h2>

    <div class="folders" id="folders">
        <div class="empty">
            Loading folders...
        </div>
    </div>

    <div id="status"></div>

</div>

<script>

    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL = "https://swqfgyeqltyzeudeaepn.supabase.co";

    const SUPABASE_KEY = "sb_publishable_IFCmPqb8d-CFUVZ8KMr4Iw_eV1QbvsD";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // ==========================================
    // LOAD FOLDERS
    // ==========================================

    async function loadFolders() {

        const { data, error } = await supabaseClient
            .from("folders")
            .select("*")
            .order("created_at", { ascending: true });

        if (error) {

            console.error(error);

            document.getElementById("folders").innerHTML =
                "<div class='empty'>Unable to load folders.</div>";

            return;
        }

        const foldersContainer =
            document.getElementById("folders");

        foldersContainer.innerHTML = "";

        if (data.length === 0) {

            foldersContainer.innerHTML =
                "<div class='empty'>No folders yet.</div>";

            return;
        }

        data.forEach(folder => {

            const folderElement =
                document.createElement("div");

            folderElement.className = "folder";

            folderElement.innerHTML = `
                <div class="folder-icon">
                    ${folder.icon || "📁"}
                </div>

                <div class="folder-name">
                    ${folder.name}
                </div>

                <div class="folder-count">
                    Open folder
                </div>
            `;

            foldersContainer.appendChild(folderElement);

        });
    }


    // ==========================================
    // CREATE FOLDER
    // ==========================================

    async function createFolder() {

        const name =
            prompt("Enter the folder name:");

        if (!name) return;

        const { error } =
            await supabaseClient
                .from("folders")
                .insert({
                    name: name,
                    icon: "📁"
                });

        if (error) {

            alert("Could not create folder.");

            console.error(error);

            return;
        }

        alert("Folder created successfully!");

        loadFolders();
    }


    // ==========================================
    // UPLOAD
    // ==========================================

    function uploadMemory() {

        alert(
            "The upload system will be connected next."
        );

    }


    // ==========================================
    // START APP
    // ==========================================

    loadFolders();

</script>

</body>
</html>
