<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Our School Memories</title>

    <script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
            color: #222;
        }

        header {
            background: #111;
            color: white;
            padding: 35px 20px;
            text-align: center;
        }

        header h1 {
            font-size: 30px;
            margin-bottom: 8px;
        }

        header p {
            color: #aaa;
        }

        .container {
            max-width: 1000px;
            margin: auto;
            padding: 25px 20px;
        }

        .actions {
            display: flex;
            gap: 10px;
            margin-bottom: 25px;
            flex-wrap: wrap;
        }

        button {
            border: none;
            padding: 12px 18px;
            border-radius: 8px;
            cursor: pointer;
            font-size: 15px;
        }

        .upload-btn {
            background: #111;
            color: white;
        }

        .folder-btn {
            background: white;
            border: 1px solid #ddd;
        }

        .back-btn {
            background: #111;
            color: white;
            margin-bottom: 20px;
        }

        h2 {
            margin-bottom: 18px;
        }

        .folders {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(180px, 1fr));
            gap: 15px;
        }

        .folder {
            background: white;
            padding: 25px;
            border-radius: 12px;
            border: 1px solid #e5e5e5;
            cursor: pointer;
            transition: 0.2s;
        }

        .folder:hover {
            transform: translateY(-3px);
            box-shadow: 0 5px 15px rgba(0,0,0,0.08);
        }

        .folder-icon {
            font-size: 35px;
            margin-bottom: 12px;
        }

        .folder-name {
            font-weight: bold;
            font-size: 16px;
        }

        .folder-count {
            color: #888;
            margin-top: 6px;
            font-size: 14px;
        }

        .gallery {
            display: grid;
            grid-template-columns: repeat(auto-fill, minmax(150px, 1fr));
            gap: 10px;
        }

        .memory {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            border: 1px solid #ddd;
        }

        .memory img {
            width: 100%;
            height: 180px;
            object-fit: cover;
            display: block;
        }

        .memory-info {
            padding: 10px;
            font-size: 13px;
        }

        .empty {
            text-align: center;
            padding: 50px 20px;
            color: #888;
        }

        .hidden {
            display: none;
        }

        #status {
            text-align: center;
            margin-top: 15px;
            color: #777;
        }
    </style>
</head>

<body>

<header>
    <h1>Our School Memories</h1>
    <p>2025 — 2026</p>
</header>


<!-- HOME PAGE -->

<div class="container" id="homePage">

    <div class="actions">

        <button class="upload-btn" onclick="uploadMemory()">
            📤 Upload Memory
        </button>

        <button class="folder-btn" onclick="createFolder()">
            + Create Folder
        </button>

    </div>

    <h2>Memory Folders</h2>

    <div class="folders" id="folders">
        <div class="empty">
            Loading folders...
        </div>
    </div>

</div>


<!-- FOLDER PAGE -->

<div class="container hidden" id="folderPage">

    <button class="back-btn" onclick="showHome()">
        ← Back to Folders
    </button>

    <h2 id="folderTitle">
        Memories
    </h2>

    <div class="gallery" id="gallery">

        <div class="empty">
            Loading memories...
        </div>

    </div>

</div>


<script>

    // ==========================================
    // SUPABASE CONNECTION
    // ==========================================

    const SUPABASE_URL = "https://swqfgyeqltyzeudeaepn.supabase.co";

    const SUPABASE_KEY = "sb_publishable_IFCmPqb8d-CFUVZ8KMr4Iw_eV1QbvsD";

    const supabaseClient = supabase.createClient(
        SUPABASE_URL,
        SUPABASE_KEY
    );


    // ==========================================
    // LOAD FOLDERS
    // ==========================================

    async function loadFolders() {

        const foldersContainer =
            document.getElementById("folders");

        foldersContainer.innerHTML =
            "<div class='empty'>Loading folders...</div>";

        const { data, error } = await supabaseClient
            .from("folders")
            .select("*")
            .order("created_at", { ascending: true });


        if (error) {

            console.error(error);

            foldersContainer.innerHTML =
                "<div class='empty'>Unable to load folders.</div>";

            return;
        }


        foldersContainer.innerHTML = "";


        if (!data || data.length === 0) {

            foldersContainer.innerHTML =
                "<div class='empty'>No folders yet.</div>";

            return;
        }


        data.forEach(folder => {

            const folderElement =
                document.createElement("div");

            folderElement.className = "folder";


            folderElement.innerHTML = `

                <div class="folder-icon">
                    ${folder.icon || "📁"}
                </div>

                <div class="folder-name">
                    ${folder.name}
                </div>

                <div class="folder-count">
                    Open folder →
                </div>

            `;


            folderElement.onclick = function() {

                openFolder(folder);

            };


            foldersContainer.appendChild(folderElement);

        });

    }


    // ==========================================
    // OPEN FOLDER
    // ==========================================

    async function openFolder(folder) {

        document
            .getElementById("homePage")
            .classList.add("hidden");

        document
            .getElementById("folderPage")
            .classList.remove("hidden");


        document
            .getElementById("folderTitle")
            .textContent =
            folder.icon + " " + folder.name;


        const gallery =
            document.getElementById("gallery");


        gallery.innerHTML =
            "<div class='empty'>Loading memories...</div>";


        const { data, error } =
            await supabaseClient

                .from("memories")

                .select("*")

                .eq("folder_id", folder.id)

                .order("created_at", {
                    ascending: false
                });


        if (error) {

            console.error(error);

            gallery.innerHTML =
                "<div class='empty'>Unable to load memories.</div>";

            return;
        }


        gallery.innerHTML = "";


        if (!data || data.length === 0) {

            gallery.innerHTML = `

                <div class="empty">

                    <h3>No memories yet 📸</h3>

                    <p>
                        Memories uploaded to this folder
                        will appear here.
                    </p>

                </div>

            `;

            return;
        }


        data.forEach(memory => {

            const memoryElement =
                document.createElement("div");

            memoryElement.className = "memory";


            memoryElement.innerHTML = `

                <img
                    src="${memory.file_url}"
                    alt="${memory.caption || "School memory"}"
                >

                <div class="memory-info">

                    <strong>
                        ${memory.caption || ""}
                    </strong>

                    <br>

                    <span>
                        ${memory.uploader_name || "Anonymous"}
                    </span>

                </div>

            `;


            gallery.appendChild(memoryElement);

        });

    }


    // ==========================================
    // BACK TO HOME
    // ==========================================

    function showHome() {

        document
            .getElementById("folderPage")
            .classList.add("hidden");

        document
            .getElementById("homePage")
            .classList.remove("hidden");

    }


    // ==========================================
    // CREATE FOLDER
    // ==========================================

    async function createFolder() {

        const name =
            prompt("Enter the folder name:");

        if (!name) return;


        const { error } =
            await supabaseClient

                .from("folders")

                .insert({

                    name: name,

                    icon: "📁"

                });


        if (error) {

            console.error(error);

            alert(
                "Could not create folder."
            );

            return;
        }


        alert(
            "Folder created successfully!"
        );


        loadFolders();

    }


    // ==========================================
    // UPLOAD
    // ==========================================

    function uploadMemory() {

        alert(
            "Photo upload will be added next."
        );

    }


    // ==========================================
    // START
    // ==========================================

    loadFolders();

</script>

</body>
</html>
