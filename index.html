<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Our School Memories</title>

<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>

<style>
* {
    box-sizing: border-box;
}

html {
    scroll-behavior: smooth;
}

body {
    margin: 0;
    font-family: Arial, Helvetica, sans-serif;
    background: #f5f5f5;
    color: #222;
}

/* ================= HEADER ================= */

header {
    background: #111;
    color: white;
    text-align: center;
    padding: 26px 15px;
}

header h1 {
    margin: 0;
    font-size: 25px;
    letter-spacing: 0.3px;
}

header p {
    margin: 7px 0 0;
    color: #aaa;
    font-size: 13px;
}

/* ================= CONTAINER ================= */

.container {
    width: 100%;
    max-width: 1150px;
    margin: auto;
    padding: 22px;
}

/* ================= BUTTONS ================= */

.actions {
    display: flex;
    gap: 10px;
    flex-wrap: wrap;
    margin-bottom: 22px;
}

button {
    border: none;
    border-radius: 8px;
    padding: 11px 16px;
    font-size: 14px;
    cursor: pointer;
    transition: 0.2s;
}

button:active {
    transform: scale(0.97);
}

.primary-btn {
    background: #111;
    color: white;
}

.secondary-btn {
    background: white;
    color: #222;
    border: 1px solid #ddd;
}

.primary-btn:hover {
    background: #292929;
}

/* ================= TITLES ================= */

.page-title {
    margin: 5px 0 17px;
    font-size: 21px;
}

/* ================= FOLDERS ================= */

.folders {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 16px;
}

.folder {
    background: white;
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 20px;
    cursor: pointer;
    transition: 0.2s;
}

.folder:hover {
    transform: translateY(-3px);
    box-shadow: 0 7px 20px rgba(0,0,0,0.08);
}

.folder-icon {
    font-size: 34px;
    margin-bottom: 12px;
}

.folder-name {
    font-size: 16px;
    font-weight: bold;
}

.folder-count {
    margin-top: 6px;
    font-size: 13px;
    color: #888;
}

/* ================= UPLOAD ================= */

.upload-box {
    background: white;
    border: 1px solid #ddd;
    border-radius: 14px;
    padding: 18px;
    margin-bottom: 25px;
}

.upload-box h3 {
    margin: 0 0 12px;
    font-size: 17px;
}

.file-input {
    width: 100%;
    margin-bottom: 14px;
}

.status {
    margin-top: 10px;
    font-size: 14px;
    color: #555;
}

/* ================= GALLERY ================= */

.gallery {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 15px;
}

.memory {
    background: white;
    border-radius: 12px;
    overflow: hidden;
    border: 1px solid #ddd;
    aspect-ratio: 1 / 1;
    cursor: pointer;
    position: relative;
}

.memory img {
    width: 100%;
    height: 100%;
    display: block;
    object-fit: cover;
    transition: transform 0.25s ease;
}

.memory:hover img {
    transform: scale(1.04);
}

/* ================= EMPTY ================= */

.empty {
    width: 100%;
    text-align: center;
    padding: 55px 20px;
    color: #888;
    font-size: 14px;
}

/* ================= VIEWER ================= */

.viewer {
    display: none;
    position: fixed;
    inset: 0;
    z-index: 9999;
    background: rgba(0,0,0,0.96);
    align-items: center;
    justify-content: center;
    touch-action: pan-y;
}

.viewer.active {
    display: flex;
}

.viewer-image {
    max-width: 86%;
    max-height: 84vh;
    object-fit: contain;
    border-radius: 8px;
    user-select: none;
}

/* ================= VIEWER BUTTONS ================= */

.close-viewer {
    position: absolute;
    top: 18px;
    right: 22px;
    color: white;
    font-size: 36px;
    line-height: 1;
    cursor: pointer;
    z-index: 3;
}

.nav-button {
    position: absolute;
    top: 50%;
    transform: translateY(-50%);
    width: 48px;
    height: 48px;
    border-radius: 50%;
    background: rgba(255,255,255,0.15);
    color: white;
    font-size: 28px;
    display: flex;
    align-items: center;
    justify-content: center;
    z-index: 3;
    backdrop-filter: blur(5px);
}

.nav-button:hover {
    background: rgba(255,255,255,0.28);
}

.previous {
    left: 18px;
}

.next {
    right: 18px;
}

.photo-counter {
    position: absolute;
    bottom: 22px;
    left: 50%;
    transform: translateX(-50%);
    color: white;
    background: rgba(0,0,0,0.5);
    padding: 7px 13px;
    border-radius: 20px;
    font-size: 13px;
}

/* ================= MOBILE ================= */

@media (max-width: 600px) {

    header {
        padding: 20px 10px;
    }

    header h1 {
        font-size: 21px;
    }

    .container {
        padding: 14px;
    }

    .folders {
        grid-template-columns: repeat(2, 1fr);
        gap: 10px;
    }

    .folder {
        padding: 15px;
        border-radius: 11px;
    }

    .folder-icon {
        font-size: 28px;
    }

    .folder-name {
        font-size: 14px;
    }

    .gallery {
        grid-template-columns: repeat(2, 1fr);
        gap: 8px;
    }

    .memory {
        border-radius: 8px;
    }

    .viewer-image {
        max-width: 94%;
        max-height: 82vh;
    }

    .nav-button {
        width: 40px;
        height: 40px;
        font-size: 23px;
        background: rgba(255,255,255,0.12);
    }

    .previous {
        left: 8px;
    }

    .next {
        right: 8px;
    }

    .close-viewer {
        top: 15px;
        right: 17px;
        font-size: 32px;
    }
}
</style>
</head>

<body>

<header>
    <h1>Our School Memories</h1>
    <p>2025 – 2026</p>
</header>

<div class="container">

    <!-- ================= FOLDER PAGE ================= -->

    <section id="folderPage">

        <div class="actions">

            <button
                class="primary-btn"
                onclick="createFolder()">
                + Create Folder
            </button>

        </div>

        <h2 class="page-title">
            Memory Folders
        </h2>

        <div
            id="folders"
            class="folders">

            <div class="empty">
                Loading folders...
            </div>

        </div>

    </section>


    <!-- ================= MEMORY PAGE ================= -->

    <section
        id="memoryPage"
        style="display:none;">

        <div class="actions">

            <button
                class="primary-btn"
                onclick="showFolders()">
                ← Back to Folders
            </button>

        </div>

        <h2
            id="currentFolderName"
            class="page-title">
        </h2>

        <div class="upload-box">

            <h3>
                📸 Upload a Memory
            </h3>

            <input
                id="photoInput"
                class="file-input"
                type="file"
                accept="image/*"
                multiple
            >

            <button
                class="primary-btn"
                onclick="uploadPhotos()">
                ⬆️ Upload Photos
            </button>

            <div
                id="status"
                class="status">
            </div>

        </div>

        <div
            id="gallery"
            class="gallery">

            <div class="empty">
                Loading memories...
            </div>

        </div>

    </section>

</div>


<!-- ================= FULLSCREEN VIEWER ================= -->

<div
    id="viewer"
    class="viewer">

    <span
        class="close-viewer"
        onclick="closeViewer()">
        ×
    </span>

    <button
        id="previousButton"
        class="nav-button previous"
        onclick="previousPhoto()">
        ‹
    </button>

    <img
        id="viewerImage"
        class="viewer-image"
        src=""
        alt="School memory"
    >

    <button
        id="nextButton"
        class="nav-button next"
        onclick="nextPhoto()">
        ›
    </button>

    <div
        id="photoCounter"
        class="photo-counter">
        1 / 1
    </div>

</div>


<script>

/* =========================================================
   SUPABASE
========================================================= */

const SUPABASE_URL =
"https://swqfgyeqltyzeudeaepn.supabase.co";

const SUPABASE_KEY =
"sb_publishable_IFCmPqb8d-CFUVZ8KMr4Iw_eV1QbvsD";

const supabaseClient =
supabase.createClient(
    SUPABASE_URL,
    SUPABASE_KEY
);


/* =========================================================
   GLOBAL VARIABLES
========================================================= */

let currentFolder = null;

let currentMemories = [];

let currentPhotoIndex = 0;


/* =========================================================
   LOAD FOLDERS
========================================================= */

async function loadFolders() {

    const container =
        document.getElementById("folders");

    container.innerHTML =
        `<div class="empty">
            Loading folders...
        </div>`;

    const { data, error } =
        await supabaseClient
        .from("folders")
        .select("*")
        .order("created_at", {
            ascending: true
        });

    if (error) {

        console.error(error);

        container.innerHTML =
            `<div class="empty">
                ❌ Unable to load folders.
            </div>`;

        return;
    }

    if (!data || data.length === 0) {

        container.innerHTML =
            `<div class="empty">
                📁 No folders yet.
            </div>`;

        return;
    }

    container.innerHTML = "";

    for (const folder of data) {

        const { count, error: countError } =
            await supabaseClient
            .from("memories")
            .select("*", {
                count: "exact",
                head: true
            })
            .eq("folder_id", folder.id);

        if (countError) {
            console.error(countError);
        }

        const card =
            document.createElement("div");

        card.className = "folder";

        card.onclick = function() {
            openFolder(folder);
        };

        card.innerHTML = `

            <div class="folder-icon">
                ${folder.icon || "📁"}
            </div>

            <div class="folder-name">
                ${escapeHTML(folder.name)}
            </div>

            <div class="folder-count">
                ${count || 0}
                ${(count || 0) === 1 ? "memory" : "memories"}
            </div>

        `;

        container.appendChild(card);
    }
}


/* =========================================================
   CREATE FOLDER
========================================================= */

async function createFolder() {

    const name =
        prompt("Enter the folder name:");

    if (!name || !name.trim()) {
        return;
    }

    const { error } =
        await supabaseClient
        .from("folders")
        .insert({
            name: name.trim(),
            icon: "📁"
        });

    if (error) {

        console.error(error);

        alert(
            "Could not create folder.\n\n" +
            error.message
        );

        return;
    }

    await loadFolders();

    alert("Folder created successfully!");
}


/* =========================================================
   OPEN FOLDER
========================================================= */

async function openFolder(folder) {

    currentFolder = folder;

    document.getElementById("folderPage")
        .style.display = "none";

    document.getElementById("memoryPage")
        .style.display = "block";

    document.getElementById("currentFolderName")
        .textContent =
        `${folder.icon || "📁"} ${folder.name}`;

    await loadMemories();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   BACK TO FOLDERS
========================================================= */

function showFolders() {

    currentFolder = null;

    currentMemories = [];

    document.getElementById("memoryPage")
        .style.display = "none";

    document.getElementById("folderPage")
        .style.display = "block";

    loadFolders();

    window.scrollTo({
        top: 0,
        behavior: "smooth"
    });
}


/* =========================================================
   LOAD MEMORIES
========================================================= */

async function loadMemories() {

    const gallery =
        document.getElementById("gallery");

    gallery.innerHTML =
        `<div class="empty">
            Loading memories...
        </div>`;

    if (!currentFolder) {
        return;
    }

    const { data, error } =
        await supabaseClient
        .from("memories")
        .select("*")
        .eq("folder_id", currentFolder.id)
        .order("created_at", {
            ascending: false
        });

    if (error) {

        console.error(error);

        gallery.innerHTML =
            `<div class="empty">
                ❌ Unable to load memories.
            </div>`;

        return;
    }

    currentMemories =
        data || [];

    if (currentMemories.length === 0) {

        gallery.innerHTML =
            `<div class="empty">
                📸 No memories yet.
                <br><br>
                Upload your first memory above.
            </div>`;

        return;
    }

    gallery.innerHTML = "";

    currentMemories.forEach(
        (memory, index) => {

            const card =
                document.createElement("div");

            card.className = "memory";

            card.innerHTML = `

                <img
                    src="${memory.file_url}"
                    alt="School memory"
                    loading="lazy"
                >

            `;

            card.onclick = function() {
                openViewer(index);
            };

            gallery.appendChild(card);
        }
    );
}


/* =========================================================
   UPLOAD PHOTOS
========================================================= */

async function uploadPhotos() {

    if (!currentFolder) {

        alert("Please open a folder first.");

        return;
    }

    const input =
        document.getElementById("photoInput");

    const files =
        Array.from(input.files);

    const status =
        document.getElementById("status");

    if (files.length === 0) {

        alert(
            "Please select at least one photo."
        );

        return;
    }

    status.innerHTML =
        "⏳ Preparing upload...";

    let uploaded = 0;

    for (const file of files) {

        try {

            status.innerHTML =
                `⏳ Uploading ${uploaded + 1} of ${files.length}...`;


            /* Create unique filename */

            const cleanName =
                file.name.replace(
                    /[^a-zA-Z0-9.-]/g,
                    "_"
                );

            const uniqueName =
                `${Date.now()}-${Math.random()
                .toString(36)
                .substring(2)}-${cleanName}`;

            const filePath =
                `${currentFolder.id}/${uniqueName}`;


            /* Upload to Supabase Storage */

            const { error: uploadError } =
                await supabaseClient
                .storage
                .from("memories")
                .upload(
                    filePath,
                    file,
                    {
                        cacheControl: "3600",
                        upsert: false
                    }
                );

            if (uploadError) {
                throw uploadError;
            }


            /* Get public URL */

            const { data: publicData } =
                supabaseClient
                .storage
                .from("memories")
                .getPublicUrl(filePath);

            const publicURL =
                publicData.publicUrl;


            /* Save URL to database */

            const { error: databaseError } =
                await supabaseClient
                .from("memories")
                .insert({

                    folder_id:
                        currentFolder.id,

                    file_url:
                        publicURL
                });

            if (databaseError) {
                throw databaseError;
            }

            uploaded++;

        }

        catch (error) {

            console.error(error);

            status.innerHTML =
                `❌ Upload failed: ${error.message}`;

            return;
        }
    }

    input.value = "";

    status.innerHTML =
        `✅ ${uploaded} photo${
            uploaded === 1 ? "" : "s"
        } uploaded successfully!`;

    await loadMemories();
}


/* =========================================================
   OPEN VIEWER
========================================================= */

function openViewer(index) {

    if (
        !currentMemories.length ||
        index < 0 ||
        index >= currentMemories.length
    ) {
        return;
    }

    currentPhotoIndex = index;

    updateViewer();

    document.getElementById("viewer")
        .classList.add("active");

    document.body.style.overflow = "hidden";
}


/* =========================================================
   UPDATE VIEWER
========================================================= */

function updateViewer() {

    if (!currentMemories.length) {
        return;
    }

    const memory =
        currentMemories[currentPhotoIndex];

    document.getElementById("viewerImage")
        .src = memory.file_url;

    document.getElementById("photoCounter")
        .textContent =
        `${currentPhotoIndex + 1} / ${currentMemories.length}`;

    const previous =
        document.getElementById("previousButton");

    const next =
        document.getElementById("nextButton");

    if (currentMemories.length <= 1) {

        previous.style.display = "none";
        next.style.display = "none";

    } else {

        previous.style.display = "flex";
        next.style.display = "flex";
    }
}


/* =========================================================
   NEXT PHOTO
========================================================= */

function nextPhoto() {

    if (currentMemories.length <= 1) {
        return;
    }

    currentPhotoIndex++;

    if (
        currentPhotoIndex >=
        currentMemories.length
    ) {
        currentPhotoIndex = 0;
    }

    updateViewer();
}


/* =========================================================
   PREVIOUS PHOTO
========================================================= */

function previousPhoto() {

    if (currentMemories.length <= 1) {
        return;
    }

    currentPhotoIndex--;

    if (currentPhotoIndex < 0) {
        currentPhotoIndex =
            currentMemories.length - 1;
    }

    updateViewer();
}


/* =========================================================
   CLOSE VIEWER
========================================================= */

function closeViewer() {

    document.getElementById("viewer")
        .classList.remove("active");

    document.getElementById("viewerImage")
        .src = "";

    document.body.style.overflow = "";
}


/* =========================================================
   KEYBOARD CONTROLS
========================================================= */

document.addEventListener(
    "keydown",
    function(event) {

        const viewer =
            document.getElementById("viewer");

        if (!viewer.classList.contains("active")) {
            return;
        }

        if (event.key === "ArrowRight") {
            nextPhoto();
        }

        if (event.key === "ArrowLeft") {
            previousPhoto();
        }

        if (event.key === "Escape") {
            closeViewer();
        }
    }
);


/* =========================================================
   MOBILE SWIPE
========================================================= */

let touchStartX = 0;
let touchEndX = 0;

const viewer =
    document.getElementById("viewer");

viewer.addEventListener(
    "touchstart",
    function(event) {

        touchStartX =
            event.changedTouches[0].screenX;
    },
    { passive: true }
);

viewer.addEventListener(
    "touchend",
    function(event) {

        touchEndX =
            event.changedTouches[0].screenX;

        handleSwipe();
    },
    { passive: true }
);


function handleSwipe() {

    const distance =
        touchEndX - touchStartX;

    const minimumSwipe =
        50;

    if (
        Math.abs(distance) <
        minimumSwipe
    ) {
        return;
    }

    if (distance < 0) {
        nextPhoto();
    } else {
        previousPhoto();
    }
}


/* =========================================================
   ESCAPE HTML
========================================================= */

function escapeHTML(text) {

    const div =
        document.createElement("div");

    div.textContent =
        text;

    return div.innerHTML;
}


/* =========================================================
   START APPLICATION
========================================================= */

loadFolders();

</script>

</body>
</html>
